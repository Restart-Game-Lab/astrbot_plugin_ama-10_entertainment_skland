name: Sync device database

"on":
  schedule:
    # 每月 1 号 02:00 UTC (北京 10:00) 检查一次上游机型库
    - cron: '0 2 1 * *'
  workflow_dispatch:  # 手动触发

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-devices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest devices.json from upstream
        run: |
          curl -fsSL -o data/devices.json https://raw.githubusercontent.com/bsthen/device-models/main/devices.json

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- data/devices.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::机型库无变化，无需更新"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and open PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="ci/sync-device-db-$(date +%Y%m%d%H%M)"
          git checkout -b "$BRANCH"
          git add data/devices.json
          git commit -m "chore: 同步上游机型库 devices.json (来自 bsthen/device-models)"
          git push origin "$BRANCH"

          # 若已有同名 PR 则跳过 (jq 表达式用双引号防 YAML 单引号歧义)
          if gh pr list --head "$BRANCH" --json number -q ".[0].number" >/dev/null 2>&1; then
            echo "::notice::上游机型库 PR 已存在"
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: 同步机型库 devices.json ($(date +%Y-%m-%d))" \
            --body "每月自动从 bsthen/device-models (Apache-2.0, Google Play 支持设备列表) 同步最新 data/devices.json。机型池更新, 无破坏性变更, 请 review 后合并。"